name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tests run on synthetic fixtures, so neither the private corpus nor
      # any of the modelling dependencies are needed here. pymupdf is not a
      # modelling dependency: it is the page reader's only one, and the reader
      # tests build their own PDFs. The reader's OCR path is not installed, so
      # the scan tests skip; see the OCR notes in AGENTS.md.
      - run: pip install pytest pymupdf
      - run: python -m pytest -q
