name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The protocol suite starts the local stdio server with a synthetic,
      # temporary model and PDF. It needs neither the private corpus nor a
      # committed artifact. OCR remains optional, so scan tests skip here.
      - run: pip install pytest -r requirements-mcp.txt
      - run: python -m pytest -q
