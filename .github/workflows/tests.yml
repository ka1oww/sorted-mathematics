name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tests need neither the private corpus nor modelling dependencies:
      # ordinary reader fixtures build their own PDFs and public-paper tests
      # skip without their non-committed PDFs. pymupdf is the page reader's only
      # product dependency. The OCR path is not installed, so scan tests skip;
      # see the OCR notes in AGENTS.md.
      - run: pip install pytest pymupdf
      - run: python -m pytest -q
