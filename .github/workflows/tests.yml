name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tests run on synthetic fixtures, so neither the private corpus nor
      # any of the modelling dependencies are needed here.
      - run: pip install pytest
      - run: python -m pytest -q
